<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis préstamos (sin conexión)</title>
<style>
:root{
  --bg:#070B0E; --surface:#111922; --surface-hover:#182330; --ink:#F0F6FC; --muted:#8B949E; --line:#212D3B;
  --brand:#00FFCC; --brand-ink:#070B0E; --brand-soft:rgba(0,255,204,0.12);
  --ok:#3FB950; --ok-bg:rgba(63,185,80,0.15); --warn:#D29922; --warn-bg:rgba(210,153,34,0.15); --bad:#F85149; --bad-bg:rgba(248,81,73,0.15);
  --off:#8B949E; --off-bg:rgba(139,148,158,0.15); --info:#58A6FF; --info-bg:rgba(88,166,255,0.15);
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root[data-theme="light"]{
    --bg:#F4F7FA; --surface:#FFFFFF; --surface-hover:#E9EDF2; --ink:#1A222C; --muted:#64748B; --line:#E2E8F0;
    --brand:#008767; --brand-ink:#FFFFFF; --brand-soft:rgba(0,135,103,0.1);
    --ok:#10B981; --ok-bg:rgba(16,185,129,0.12); --warn:#F59E0B; --warn-bg:rgba(245,158,11,0.12); --bad:#EF4444; --bad-bg:rgba(239,68,68,0.12);
    --off:#64748B; --off-bg:rgba(100,116,139,0.12); --info:#3B82F6; --info-bg:rgba(59,130,246,0.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-hover:#E9EDF2; --ink:#1A222C; --muted:#64748B; --line:#E2E8F0;
  --brand:#008767; --brand-ink:#FFFFFF; --brand-soft:rgba(0,135,103,0.1);
  --ok:#10B981; --ok-bg:rgba(16,185,129,0.12); --warn:#F59E0B; --warn-bg:rgba(245,158,11,0.12); --bad:#EF4444; --bad-bg:rgba(239,68,68,0.12);
  --off:#64748B; --off-bg:rgba(100,116,139,0.12); --info:#3B82F6; --info-bg:rgba(59,130,246,0.12);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{font-weight:600;font-size:1.1rem;padding:0 10px 16px;color:var(--brand)}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}
.nav a svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a:hover{background:var(--brand-soft)}
main{padding:28px clamp(16px,4vw,40px) 60px;max-width:1100px;width:100%}
.tabbar{display:none}

.viewhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.viewhead .sub{color:var(--muted);margin:4px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:4px 12px;font-size:.9rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px;margin-bottom:10px}
.ledger .lrow{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));gap:12px;padding:14px 0;align-items:end}
.ledger .lrow+.lrow{border-top:1px solid var(--line)}
.ledger .cur{font-weight:600}
.ledger .k{display:block;color:var(--muted);font-size:.82rem}
.ledger .v{font-size:1.25rem;font-weight:600}
.ledger .v.bad{color:var(--bad)}
.stats{color:var(--muted);margin:0 0 26px}
.stats b{color:var(--ink)}

.sec{margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2 small{color:var(--muted);font-weight:400;font-size:.9rem;margin-left:6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.row .main{min-width:0}
.row .name{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:.88rem;display:block}
.row .side2{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .amt{font-weight:600}
.row .acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:26px 18px;color:var(--muted);text-align:center}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.off{background:var(--off-bg);color:var(--off)} .badge.info{background:var(--info-bg);color:var(--info)}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.search{flex:1 1 220px;min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:42px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

.cols{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){ .cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.kv div{min-width:0} .kv dt{color:var(--muted);font-size:.82rem} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;color:var(--muted);text-decoration:none}
.note{padding:12px 0;border-top:1px solid var(--line)} .note:first-child{border-top:0}
.note .when{color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:8px}
.note p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
textarea{width:100%;min-height:84px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:8px;border-bottom:1px solid var(--line)} .table .r{text-align:right}
.tablewrap{overflow-x:auto}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0}

.scrim{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.sheet.wide{width:min(760px,calc(100vw - 24px))}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet .x{border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;min-width:42px;min-height:42px;border-radius:8px}
.sheet-body{padding:16px 18px 20px;overflow:auto}
label{display:block;margin:0 0 12px;font-weight:500;font-size:.92rem}
label input,label select{display:block;width:100%;margin-top:4px;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--muted);font-size:.86rem;margin:-4px 0 12px}
.preview{background:var(--brand-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin:4px 0 14px;font-size:.92rem}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:40;max-width:calc(100vw - 32px)}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;margin-top:6px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#toast div.err{background:var(--bad);color:#fff}

@media (max-width:899px){
  .app{display:block}
  .side{display:none}
  main{padding:18px 14px 110px}
  h1{font-size:1.4rem}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:.72rem;min-height:48px;border-radius:10px}
  .tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a[aria-current="page"]{color:var(--brand);font-weight:600}
  .ledger .lrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ledger .cur{grid-column:1 / -1}
  .ledger .v{font-size:1.05rem}
  .sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:92vh;border-radius:18px 18px 0 0}
  .sheet.wide{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Futuristic Neon & Glassmorphism Enhancements */
body { background: radial-gradient(circle at top right, rgba(0,255,204,0.04), transparent 40%), var(--bg); }
.side { background: linear-gradient(180deg, var(--surface) 0%, rgba(17,25,34,0.95) 100%); backdrop-filter: blur(12px); border-right: 1px solid var(--line); }
.brand { font-family: system-ui, sans-serif; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, var(--brand), #58A6FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card, .ledger, .list, .sheet { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(8px); }
.row:hover { background: var(--surface-hover); }
.btn { border-radius: 12px; font-weight: 600; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.btn.primary { background: linear-gradient(135deg, var(--brand), #00B4D8); color: var(--brand-ink); border: none; box-shadow: 0 4px 16px rgba(0,255,204,0.25); }
.btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.badge { border-radius: 8px; font-weight: 700; letter-spacing: 0.3px; padding: 3px 10px; }
.search, input, select, textarea { border-radius: 12px; border: 1px solid var(--line); background: var(--bg); transition: border-color 0.2s, box-shadow 0.2s; }
.search:focus, input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand">Mis préstamos<br><small style="font-weight:400;color:var(--muted);font-size:.78rem">Versión sin conexión</small></div>
    <nav class="nav" id="nav-side"></nav>
  </aside>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" id="nav-tab" aria-label="Secciones"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ================= utilidades ================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const pISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const fdate = d => d ? pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() : '—';
const fISO = s => fdate(pISO(s));
const nf = new Intl.NumberFormat('es-BO', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always'});
const money = (v, cur) => (v == null || isNaN(v)) ? '—' : nf.format(v) + (cur ? ' ' + cur : '');
const r2 = x => Math.round(x * 100) / 100;
const num = x => {
  if (x === '' || x == null) return null;
  let s = String(x).trim().replace(/\s/g, '').replace(',', '.');
  const parts = s.split('.'); if (parts.length > 2) s = parts.slice(0, -1).join('') + '.' + parts[parts.length-1];
  const n = parseFloat(s); return isNaN(n) ? null : n;
};
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const DAY = 86400000;
const normName = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();

/* ================= cálculo de préstamos ================= */
const PPM = {Mensual:1, Quincenal:2, Semanal:4};
function dueDate(first, freq, k){
  const d = pISO(first); if (!d) return null;
  if (!freq || freq === 'Mensual') return new Date(d.getFullYear(), d.getMonth() + k - 1, d.getDate());
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + (freq === 'Quincenal' ? 15 : 7) * (k - 1));
}
function calcLoan(L, pays, today, moraLeve){
  const paid = r2((+L.pagadoAntes || 0) + pays.reduce((a, p) => a + (+p.monto || 0), 0));
  const o = {paid, ok:false, estado:'Sin datos', sit:'Sin datos', saldo:null, total:null, cuota:null, sched:[], vencidas:0, vencido:0, prox:null, proxMonto:null, dias:0, extras:0};
  const n = +L.cuotas, rate = (L.tasa === '' || L.tasa == null) ? NaN : +L.tasa;
  if (!(L.monto > 0) || !(n >= 1) || isNaN(rate) || !pISO(L.primerVenc)) return o;
  const ppm = PPM[L.frecuencia] || 1, cap = +L.monto, simple = L.tipo === 'Simple';
  const items = []; let q;
  if (simple){
    // Simple: cada cuota paga el interés; el capital vence con la última cuota.
    q = r2(cap * rate / ppm);
    for (let k = 1; k <= n; k++) items.push({label:'Cuota ' + k, tipo:'interes', fecha:dueDate(L.primerVenc, L.frecuencia, k), monto:q});
    const dn = dueDate(L.primerVenc, L.frecuencia, n);
    items.push({label:'Capital', tipo:'capital', fecha:dn, monto:cap});
    // Pasado el plazo, mientras quede capital sin pagar, el interés sigue sumándose período a período.
    if (L.extender !== false){
      const pp = pays.map(p => ({d:pISO(p.fecha), m:+p.monto || 0})).filter(p => p.d);
      // "Pagado antes" no tiene fecha: se toma como interés ya pagado y no reduce el capital en el cálculo del interés extra.
      const patDate = d => pp.reduce((a, p) => a + (p.d <= d ? p.m : 0), 0);
      let intAcum = q * n, prev = dn, j = n + 1;
      while (prev < today && j <= n + 600){
        const capOut = cap - Math.min(cap, Math.max(0, patDate(prev) - intAcum));
        if (capOut <= 0.005) break;
        const dj = dueDate(L.primerVenc, L.frecuencia, j), qj = r2(capOut * rate / ppm);
        items.push({label:'Interés extra ' + (j - n), tipo:'extra', fecha:dj, monto:qj});
        intAcum += qj; prev = dj; j++;
      }
    }
  } else {
    const total0 = L.tipo === 'Francés' ? (rate === 0 ? cap : cap * (rate/ppm) / (1 - Math.pow(1 + rate/ppm, -n)) * n) : cap * (1 + rate * n / ppm);
    q = r2(total0 / n); const last = r2(total0 - q * (n - 1));
    for (let k = 1; k <= n; k++) items.push({label:'Cuota ' + k, tipo:'cuota', fecha:dueDate(L.primerVenc, L.frecuencia, k), monto:(k === n ? last : q)});
  }
  // Los pagos cubren primero los intereses/cuotas (en orden de fecha) y el capital al final.
  let rem = paid;
  const order = items.map((_, i) => i).sort((x, y) => ((items[x].tipo === 'capital') - (items[y].tipo === 'capital')) || (x - y));
  order.forEach(i => {
    const it = items[i], apl = Math.max(0, Math.min(it.monto, rem)); rem = r2(rem - apl);
    it.aplicado = r2(apl); it.saldo = r2(it.monto - apl);
    it.estado = it.saldo <= 0.005 ? 'Pagado' : (it.fecha < today ? 'Vencido' : (apl > 0 ? 'Parcial' : 'Pendiente'));
  });
  const total = r2(items.reduce((a, it) => a + it.monto, 0));
  const saldo = r2(items.reduce((a, it) => a + it.saldo, 0));
  o.ok = true; o.total = total; o.cuota = q; o.sched = items; o.saldo = saldo; o.extras = items.filter(i => i.tipo === 'extra').length;
  o.estado = saldo <= 0.005 ? 'Cancelado' : 'Activo';
  if (o.estado === 'Activo'){
    const venc = items.filter(c => c.saldo > 0.005 && c.fecha < today);
    o.vencidas = venc.length; o.vencido = r2(venc.reduce((a, c) => a + c.saldo, 0));
    const next = items.filter(c => c.saldo > 0.005).sort((x, y) => x.fecha - y.fecha)[0];
    if (next){ o.prox = next.fecha; o.proxMonto = next.saldo; o.dias = next.fecha < today ? Math.round((today - next.fecha) / DAY) : 0; }
    o.sit = o.dias === 0 ? 'Al día' : (o.dias <= moraLeve ? 'Mora leve' : 'Moroso');
  } else o.sit = 'Cancelado';
  return o;
}

/* ================= estado ================= */
let db = null, canWrite = true, ready = false, slow = false;
const S = {clients:{}, loans:{}, payments:{}, notes:{}, archive:[], cfg:{moraLeve:30}};
const loaded = {clients:false, loans:false, payments:false, notes:false, archive:false, cfg:false};
let D = null, T = todayD();
const UI = {q:'', f:'todos', hq:'', payLimit:60};
let sheetRefresh = null;

function derive(){
  T = todayD();
  const ml = Math.max(0, +S.cfg.moraLeve || 30);
  const byLoanPay = {};
  Object.entries(S.payments).forEach(([id, p]) => { (byLoanPay[String(p.loanId)] = byLoanPay[String(p.loanId)] || []).push(Object.assign({id}, p)); });
  const loans = {}, byClient = {};
  Object.entries(S.loans).forEach(([id, L]) => {
    const pays = (byLoanPay[id] || []).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '') || (+a.id - +b.id));
    const c = calcLoan(L, pays, T, ml); c.pays = pays;
    loans[id] = {id, L, c};
    (byClient[String(L.clienteId)] = byClient[String(L.clienteId)] || []).push(id);
  });
  const tot = {Bs:{prestado:0, cobrado:0, saldo:0, vencido:0}, '$us':{prestado:0, cobrado:0, saldo:0, vencido:0}};
  let activos = 0, enMora = 0, cuotasVenc = 0, cancelados = 0, sinDatos = [];
  Object.values(loans).forEach(({L, c}) => {
    const t = tot[L.moneda] || tot.Bs;
    t.prestado += +L.monto || 0; t.cobrado += c.paid;
    if (c.estado === 'Sin datos'){ sinDatos.push(L); return; }
    t.saldo += c.saldo || 0; t.vencido += c.vencido;
    if (c.estado === 'Activo'){ activos++; cuotasVenc += c.vencidas; if (c.dias > 0) enMora++; } else cancelados++;
  });
  D = {loans, byClient, tot, activos, enMora, cuotasVenc, cancelados, sinDatos};
}
function clientInfo(cid){
  const ids = D.byClient[String(cid)] || [];
  const o = {ids, activos:0, saldo:{Bs:0, '$us':0}, vencido:{Bs:0, '$us':0}, dias:0, sit:'Sin préstamos'};
  const rank = {'Moroso':3, 'Mora leve':2, 'Al día':1};
  let best = 0;
  ids.forEach(id => {
    const {L, c} = D.loans[id];
    if (c.estado === 'Activo'){
      o.activos++; o.saldo[L.moneda] = (o.saldo[L.moneda] || 0) + c.saldo; o.vencido[L.moneda] = (o.vencido[L.moneda] || 0) + c.vencido;
      o.dias = Math.max(o.dias, c.dias);
      if ((rank[c.sit] || 0) > best){ best = rank[c.sit]; o.sit = c.sit; }
    }
  });
  if (!o.activos && ids.length) o.sit = 'Sin saldo';
  return o;
}

/* ================= base de datos ================= */
async function put(coll, id, data){
  try { await db.collection(coll).doc(String(id)).set(data); return true; }
  catch (e) { toast('No se pudo guardar: ' + ((e && (e.message || e.code)) || 'error'), true); return false; }
}
async function remove(coll, id){
  try { await db.collection(coll).doc(String(id)).delete(); return true; }
  catch (e) { toast('No se pudo eliminar: ' + ((e && (e.message || e.code)) || 'error'), true); return false; }
}
const nextId = coll => String(Math.max(0, ...Object.keys(S[coll]).map(Number).filter(n => !isNaN(n))) + 1);

function subscribeAll(){
  const mk = (name) => db.collection(name).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
    S[name] = m; loaded[name] = true; schedule();
  }, e => fatal(e));
  ['clients', 'loans', 'payments', 'notes'].forEach(mk);
  db.doc('archive/all').onSnapshot(s => { S.archive = (s.exists && s.data().items) || []; loaded.archive = true; schedule(); }, e => fatal(e));
  db.doc('config/ajustes').onSnapshot(s => { if (s.exists) S.cfg = Object.assign({moraLeve:30}, s.data()); loaded.cfg = true; schedule(); }, e => fatal(e));
}
let fatalShown = false;
function fatal(e){
  if (fatalShown) return; fatalShown = true;
  $('#view').innerHTML = '<div class="card"><h2>No se pudo leer la información</h2><p>' + esc((e && e.message) || 'Error desconocido') + '</p><p>Cierre y vuelva a abrir esta página desde su cuenta de Claude.</p></div>';
}

function badge(sit){

const telHref = t => phoneFull(t) ? 'tel:+' + phoneFull(t) : '';
const waHref = t => phoneFull(t) ? 'https://wa.me/' + phoneFull(t) : '';

let rafId = 0;
function schedule(){ if (rafId) return; rafId = requestAnimationFrame(() => { rafId = 0; render(); }); }

function render(){
  const root = $('#view');
  if (!ready && !Object.values(loaded).every(Boolean)){
    $('#nav-side').innerHTML = navHTML(''); $('#nav-tab').innerHTML = navHTML('');
    root.innerHTML = `<div class="card"><h2>Cargando sus datos…</h2>${slow ? '<p>Está tardando más de lo normal. Revise su conexión; los datos aparecerán cuando responda.</p>' : ''}</div>`;
    return;
  }
  ready = true; derive();
  const m = /^([a-z]+)(?:-(.*))?$/.exec((location.hash || '#inicio').slice(1)) || [null, 'inicio'];
  let name = m[1], arg = m[2];
  const views = {inicio:vInicio, clientes:vClientes, cliente:vCliente, pagos:vPagos, historial:vHistorial, respaldo:vRespaldo};
  if (!views[name]) { name = 'inicio'; arg = null; }
  const navKey = name === 'cliente' ? 'clientes' : name;
  $('#nav-side').innerHTML = navHTML(navKey); $('#nav-tab').innerHTML = navHTML(navKey);
  const keep = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('search') ? document.activeElement : null;
  root.innerHTML = views[name](arg);
  if (keep) { const n = $('.search', root); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  if (sheetRefresh) sheetRefresh();
}

function vInicio(){

    <div><span class="k">Cobrado</span><span class="v">${nf.format(t[cur].cobrado)}</span></div></div>`;
  const atras = Object.values(D.loans).filter(x => x.c.estado === 'Activo' && x.c.dias > 0).sort((a, b) => b.c.dias - a.c.dias);
  const prox = Object.values(D.loans).filter(x => x.c.estado === 'Activo' && x.c.dias === 0 && x.c.prox && (x.c.prox - T) / DAY <= 7).sort((a, b) => a.c.prox - b.c.prox);

  const cobroRow = x => {
    const cl = S.clients[String(x.L.clienteId)] || {};
    const late = x.c.dias > 0;
    const when = late ? `${badge(x.c.sit)} <span class="meta">${x.c.dias} ${x.c.dias === 1 ? 'día' : 'días'} de atraso</span>` : `<span class="meta">${x.c.prox.getTime() === T.getTime() ? 'Vence hoy' : 'Vence ' + fdate(x.c.prox)}</span>`;

      <div class="main"><span class="name">${esc(cl.nombre || 'Cliente eliminado')}</span><span class="meta">Préstamo ${esc(x.id)} · ${money(x.L.monto, x.L.moneda)}</span></div>
      <div class="side2"><span class="amt">${money(late ? x.c.vencido : x.c.proxMonto, x.L.moneda)}</span>${when}</div>
      <div class="acts">${W() ? `<button class="btn small primary" data-act="pay" data-loan="${esc(x.id)}">Registrar pago</button>` : ''}${contactBtns(cl.telefono)}</div></div>`;
  };
  const noClients = !Object.keys(S.clients).length;
  let html = head('Para cobrar', `${atras.length} atrasados · ${prox.length} vencen en los próximos 7 días`,
    W() ? '<button class="btn primary" data-act="pay">Registrar pago</button><button class="btn" data-act="new-client">Nuevo cliente</button>' : '');
  if (noClients) return html + '<div class="card"><h2>Todavía no hay datos</h2><p>Agregue su primer cliente para empezar. Si ya cargó su información desde Excel, espere unos segundos y recargue.</p></div>';
  html += backupNote();
  html += `<div class="ledger">${row('Bolivianos (Bs)', 'Bs')}${row('Dólares ($us)', '$us')}</div>
    <p class="stats"><b>${D.activos}</b> préstamos activos · <b>${D.enMora}</b> en mora (${pct}%) · <b>${D.cuotasVenc}</b> cuotas vencidas · <b>${D.cancelados + S.archive.length}</b> cancelados o finalizados</p>`;
  if (D.sinDatos.length) html += `<div class="warnbox">${D.sinDatos.length} ${D.sinDatos.length === 1 ? 'préstamo tiene' : 'préstamos tienen'} datos incompletos (sin tasa, cuotas o fecha) y no se cuentan en los saldos: ${D.sinDatos.map(L => esc(cname(L.clienteId))).join(', ')}.</div>`;

  return html;
}

function clientList(){
  const q = normName(UI.q);

    const c = S.clients[id];
    if (q && !(normName(c.nombre).includes(q) || digits(c.telefono).includes(q.replace(/\D/g, '') || '\u0000'))) return false;
    const info = clientInfo(id);

  const sums = ['Bs', '$us'].filter(k => info.saldo[k] > 0 || info.vencido[k] > 0).map(k => `<div><dt>Saldo ${k}</dt><dd>${money(info.saldo[k])}</dd></div><div><dt>Vencido ${k}</dt><dd>${info.vencido[k] > 0 ? '<span class="badge bad">' + money(info.vencido[k]) + '</span>' : money(0)}</dd></div>`).join('');

  return `<a class="back" href="#clientes">‹ Clientes</a>` +
    head(c.nombre, [cal, c.telefono ? esc(c.telefono) : ''].filter(Boolean).join(' · '),
      `${contactBtns(c.telefono)}${W() ? '<button class="btn" data-act="edit-client" data-id="' + esc(cid) + '">Editar datos</button>' : ''}`) +

    <div class="card" style="margin-top:14px"><h3>Mora leve</h3><p class="hint" style="margin:6px 0 12px">Hasta cuántos días de atraso se muestra “Mora leve”. Más allá se muestra “Moroso”.</p>
      <form data-form="cfg" class="actions" style="align-items:end"><label style="margin:0">Días<input name="dias" inputmode="numeric" value="${esc(S.cfg.moraLeve)}" style="width:110px"></label><button class="btn">Guardar</button></form></div>`;
}

/* ================= ventanas (hojas) ================= */
const sheetRoot = $('#sheet-root');
function openSheet(title, html, opt){
  opt = opt || {};
  const prev = $('.sheet-body', sheetRoot); const keepTop = prev ? prev.scrollTop : 0;
  sheetRoot.innerHTML = `<div class="scrim" data-act="close-sheet"></div><div class="sheet ${opt.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="x" data-act="close-sheet" aria-label="Cerrar">×</button></header><div class="sheet-body">${html}</div></div>`;
  document.body.classList.add('noscroll');
  const b = $('.sheet-body', sheetRoot); if (b) b.scrollTop = keepTop;
  if (!opt.keep){ const f = $('input:not([type=hidden]),select,textarea', sheetRoot); if (f) f.focus(); }
}
function closeSheet(){ sheetRoot.innerHTML = ''; sheetRefresh = null; document.body.classList.remove('noscroll'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetRoot.firstChild) closeSheet(); });
function confirmSheet(title, msg, okLabel, onOk){
  sheetRefresh = null;
  openSheet(title, `<p>${msg}</p><div class="foot"><button class="btn" data-act="close-sheet">Cancelar</button><button class="btn danger" id="confirm-ok">${esc(okLabel)}</button></div>`);
  $('#confirm-ok').addEventListener('click', async () => { $('#confirm-ok').disabled = true; await onOk(); });
}

/* ---- préstamo ---- */
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function firstDueFrom(fechaISO, freq){
  const d = pISO(fechaISO); if (!d) return '';
  if (freq === 'Quincenal') return iso(addDays(d, 15));
  if (freq === 'Semanal') return iso(addDays(d, 7));
  return iso(new Date(d.getFullYear(), d.getMonth() + 1, d.getDate()));
}
function loanForm(cid, id){
  const L = id ? S.loans[id] : {moneda:'Bs', tipo:'Simple', frecuencia:'Mensual', fecha:iso(T), cuotas:'', tasa:'', pagadoAntes:0};
  if (!id) L.primerVenc = firstDueFrom(L.fecha, L.frecuencia);
  const sel = (name, vals, cur) => `<select name="${name}">${vals.map(v => `<option ${v === cur ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
  const invs = [...new Set(Object.values(S.loans).map(x => x.inversionista).filter(Boolean))];
  const tasaTxt = L.tasa === '' || L.tasa == null ? '' : String(Math.round(L.tasa * 10000) / 100).replace('.', ',');
  sheetRefresh = null;
  openSheet(id ? `Editar préstamo ${id}` : 'Nuevo préstamo', `<form data-form="loan" data-id="${esc(id || '')}" data-cid="${esc(cid)}">
    <p class="hint">Cliente: <b>${esc(cname(cid))}</b></p>
    <div class="two"><label>Moneda${sel('moneda', ['Bs', '$us'], L.moneda)}</label><label>Monto prestado<input name="monto" inputmode="decimal" required value="${esc(L.monto == null ? '' : L.monto)}"></label></div>
    <div class="two"><label>Interés mensual (%)<input name="tasa" inputmode="decimal" value="${esc(tasaTxt)}" placeholder="Ej.: 10"></label><label>Cantidad de cuotas<input name="cuotas" inputmode="numeric" value="${esc(L.cuotas == null ? '' : L.cuotas)}"></label></div>
    <div class="two"><label>Tipo de interés${sel('tipo', ['Simple', 'Fijo', 'Francés'], L.tipo)}</label><label>Frecuencia${sel('frecuencia', ['Mensual', 'Quincenal', 'Semanal'], L.frecuencia)}</label></div>
    <p class="hint">Simple: cada cuota paga solo el interés y el capital se paga al final. Fijo: cuotas iguales. Francés: cuota constante sobre saldo.</p>
    <label style="display:flex;gap:10px;align-items:flex-start;font-weight:500"><input type="checkbox" name="extender" ${L.extender !== false ? 'checked' : ''} style="display:inline-block;width:20px;min-height:0;height:20px;margin:2px 0 0;flex:none"><span>Si pasa el plazo y no paga, seguir sumando el interés cada mes <span class="hint" style="display:block;margin:2px 0 0;font-weight:400">Solo para el tipo Simple. El cobro continúa hasta que se pague el capital.</span></span></label>
    <div class="two"><label>Fecha del préstamo<input type="date" name="fecha" value="${esc(L.fecha || '')}"></label><label>Primer vencimiento<input type="date" name="primerVenc" value="${esc(L.primerVenc || '')}"></label></div>
    <div id="loanpreview" class="preview"></div>
    <label>Garantía<input name="garantia" value="${esc(L.garantia)}"></label>
    <label>Inversionista<input name="inversionista" list="invs" value="${esc(L.inversionista)}"><datalist id="invs">${invs.map(v => `<option value="${esc(v)}">`).join('')}</datalist></label>
    <label>Nota del préstamo<input name="nota" value="${esc(L.nota)}"></label>
    ${id ? `<label>Pagado antes de usar la app<input name="pagadoAntes" inputmode="decimal" value="${esc(L.pagadoAntes || 0)}"></label><p class="hint">Es un estimado migrado de su Excel. Corríjalo o póngalo en 0 si prefiere registrar todos los pagos aquí.</p>` : ''}
    <div class="foot"><button type="button" class="btn" data-act="close-sheet">Cancelar</button><button class="btn primary">Guardar préstamo</button></div></form>`);
  const form = $('form[data-form=loan]'); form.dataset.touched = id ? '1' : '';
  updateLoanPreview(form);
}
function readLoan(form){
  const f = new FormData(form); const g = k => (f.get(k) == null ? '' : String(f.get(k)).trim());
  const tasa = num(g('tasa'));
  return {moneda:g('moneda') || 'Bs', monto:num(g('monto')), tasa:tasa == null ? null : Math.round(tasa * 100) / 10000, tipo:g('tipo'), frecuencia:g('frecuencia'),
    cuotas:num(g('cuotas')) == null ? null : Math.round(num(g('cuotas'))), fecha:g('fecha') || null, primerVenc:g('primerVenc') || null,
    garantia:g('garantia'), inversionista:g('inversionista'), nota:g('nota'), extender:form.extender ? form.extender.checked : true, pagadoAntes:f.has('pagadoAntes') ? (num(g('pagadoAntes')) || 0) : undefined};
}
function updateLoanPreview(form){
  const L = readLoan(form), c = calcLoan(Object.assign({pagadoAntes:0}, L), [], T, 30);
  $('#loanpreview', form).innerHTML = c.ok ? `${L.tipo === 'Simple' ? `Interés por cuota: <b>${money(c.cuota, L.moneda)}</b> · Capital al final: <b>${money(L.monto, L.moneda)}</b> · Total del contrato: <b>${money(c.total, L.moneda)}</b>` : `Cuota: <b>${money(c.cuota, L.moneda)}</b> · Total a devolver: <b>${money(c.total, L.moneda)}</b>`}` : 'Complete monto, interés, cuotas y primer vencimiento para ver el total.';
}

/* ---- detalle de préstamo ---- */
function openLoan(id){
  const x = D.loans[id]; if (!x) return;
  const {L, c} = x;
  const cl = S.clients[String(L.clienteId)] || {};
  const kv = [['Monto prestado', money(L.monto, L.moneda)], ['Interés mensual', L.tasa == null ? '—' : Math.round(L.tasa * 10000) / 100 + '%'], ['Tipo y frecuencia', esc((L.tipo || '—') + ' · ' + (L.frecuencia || '—'))],
    ['Cuotas del contrato', L.cuotas || '—'], ['Total a devolver', c.ok ? money(c.total, L.moneda) : '—'], ['Pagado', money(c.paid, L.moneda)], ['Saldo', c.ok ? money(c.saldo, L.moneda) : '—'], ['Estado', badge(c.ok ? c.sit : 'Sin datos')]];
  if (L.garantia) kv.push(['Garantía', esc(L.garantia)]); if (L.inversionista) kv.push(['Inversionista', esc(L.inversionista)]);
  const sched = c.ok ? `<div class="tablewrap"><table class="table"><thead><tr><th>Concepto</th><th>Vence</th><th class="r">Monto</th><th class="r">Pagado</th><th>Estado</th></tr></thead><tbody>${c.sched.map(s => `<tr><td>${esc(s.label)}</td><td>${fdate(s.fecha)}</td><td class="r">${nf.format(s.monto)}</td><td class="r">${nf.format(s.aplicado)}</td><td>${badge(s.estado)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="warnbox">Faltan datos para calcular las cuotas: complete el interés, la cantidad de cuotas y el primer vencimiento.</div>';
  const pays = c.pays.slice().reverse().map(p => `<tr><td>${fISO(p.fecha)}</td><td>${esc(p.concepto || '')}</td><td class="r">${nf.format(p.monto)}</td><td class="r">${W() ? `<button class="btn small ghost" data-act="del-pay" data-id="${esc(p.id)}">Eliminar</button>` : ''}</td></tr>`).join('');
  const html = `<dl class="kv">${kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    ${c.extras > 0 ? `<div class="warnbox">Pasó el plazo y el capital sigue sin pagarse: se sumaron <b>${c.extras}</b> ${c.extras === 1 ? 'mes' : 'meses'} de interés extra y se seguirán sumando cada mes. Los pagos cubren primero los intereses y al final el capital.</div>` : ''}
    ${L.nota ? `<p class="hint" style="margin-top:12px">Nota: ${esc(L.nota)}</p>` : ''}
    ${L.pagadoAntes > 0 ? `<p class="hint">Incluye ${money(L.pagadoAntes, L.moneda)} pagados antes de usar la app (estimado desde su Excel).</p>` : ''}
    <div class="sec"><h3>Cuotas</h3></div>${sched}
    <div class="sec"><h3>Pagos de este préstamo</h3></div>
    ${pays ? `<div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th class="r">Monto</th><th></th></tr></thead><tbody>${pays}</tbody></table></div>` : '<p class="hint">Todavía no hay pagos registrados.</p>'}
    <div class="foot">${W() ? `<button class="btn danger" data-act="del-loan" data-loan="${esc(id)}">Eliminar</button><button class="btn" data-act="edit-loan" data-loan="${esc(id)}">Editar</button>${c.estado !== 'Cancelado' ? `<button class="btn primary" data-act="pay" data-loan="${esc(id)}">Registrar pago</button>` : ''}` : ''}</div>`;
  sheetRefresh = () => { if (D.loans[id]) openLoan(id); else closeSheet(); };
  openSheet(`Préstamo ${id} · ${cl.nombre || ''}`, html, {wide:true, keep:!!$('.sheet', sheetRoot)});
}

/* ---- pago ---- */
function payForm(pre){
  pre = pre || {};
  const activeLoans = Object.values(D.loans).filter(x => x.c.estado === 'Activo');
  let cids = [...new Set(activeLoans.map(x => String(x.L.clienteId)))].sort((a, b) => normName(cname(a)).localeCompare(normName(cname(b)), 'es'));
  if (!cids.length){ sheetRefresh = null; openSheet('Registrar pago', '<p>No hay préstamos activos con datos completos. Revise los préstamos de sus clientes.</p><div class="foot"><button class="btn" data-act="close-sheet">Cerrar</button></div>'); return; }
  const preCid = pre.loanId ? String(S.loans[pre.loanId].clienteId) : (pre.cid || cids[0]);
  sheetRefresh = null;
  openSheet('Registrar pago', `<form data-form="pay">
    <label>Cliente<select name="cid">${cids.map(c => `<option value="${esc(c)}" ${c === String(preCid) ? 'selected' : ''}>${esc(cname(c))}</option>`).join('')}</select></label>
    <label>Préstamo<select name="loan"></select></label>
    <div class="hint" id="payinfo"></div>
    <div class="two"><label>Monto<input name="monto" inputmode="decimal" required></label><label>Fecha del pago<input type="date" name="fecha" required value="${iso(T)}"></label></div>
    <label>Concepto<select name="concepto"><option>Pago cuota</option><option>Pago parcial</option><option>Adelanto</option><option>Cancelación total</option></select></label>
    <div id="paypreview" class="preview"></div>
    <div class="foot"><button type="button" class="btn" data-act="close-sheet">Cancelar</button><button class="btn primary">Guardar pago</button></div></form>`);
  const form = $('form[data-form=pay]');
  const fillLoans = (keepLoan) => {
    const cid = form.cid.value;
    const ls = activeLoans.filter(x => String(x.L.clienteId) === cid);
    form.loan.innerHTML = ls.map(x => `<option value="${esc(x.id)}">N° ${esc(x.id)} · ${money(x.L.monto, x.L.moneda)} · saldo ${money(x.c.saldo)}</option>`).join('');
    if (keepLoan && ls.some(x => x.id === String(keepLoan))) form.loan.value = String(keepLoan);
    form.dataset.autoamt = '1'; refreshPay(form);
  };
  form.cid.addEventListener('change', () => fillLoans());
  fillLoans(pre.loanId);
}
function refreshPay(form){
  const x = D.loans[form.loan.value]; if (!x) return;
  const c = x.c;
  $('#payinfo', form).textContent = `Saldo: ${money(c.saldo, x.L.moneda)} · ` + (c.prox ? (c.dias > 0 ? `Atrasado ${c.dias} días` : 'Próxima cuota ' + fdate(c.prox)) + ' · ' + money(c.proxMonto, x.L.moneda) : '');
  if (form.dataset.autoamt === '1'){
    form.monto.value = form.concepto.value === 'Cancelación total' ? String(c.saldo).replace('.', ',') : String(c.dias > 0 ? c.vencido : c.proxMonto).replace('.', ',');
    form.dataset.autoamt = '';
  }
  const m = num(form.monto.value);
  const pv = $('#paypreview', form);
  if (!m || m <= 0){ pv.textContent = 'Escriba el monto para ver cómo queda el préstamo.'; return; }
  const after = calcLoan(x.L, c.pays.concat([{monto:m, fecha:form.fecha.value}]), T, 30);
  pv.innerHTML = `Saldo después del pago: <b>${money(after.saldo, x.L.moneda)}</b>` + (m > c.saldo + 0.005 ? ' · <b>El monto supera el saldo actual.</b>' : '') + (after.estado === 'Cancelado' ? ' · El préstamo quedaría <b>cancelado</b>.' : '');
}

/* ================= acciones ================= */
document.addEventListener('click', async e => {
  const nv = e.target.closest('.nav a, .tabbar a'); if (nv && nv.getAttribute('href') === '#historial' && UI.hq){ UI.hq = ''; schedule(); }
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (e.target.closest('a[href]') && t.dataset.act === 'open-client') return;
  const a = t.dataset.act;
  if (t.matches('input')) return;
  if (['open-client', 'open-loan'].includes(a) && e.target.closest('button,a')) { if (e.target.closest('button,a') !== t) return; }
  switch (a){
    case 'close-sheet': closeSheet(); break;
    case 'open-client': location.hash = '#cliente-' + t.dataset.id; break;
    case 'open-loan': openLoan(t.dataset.loan); break;
    case 'new-client': clientForm(); break;
    case 'edit-client': clientForm(t.dataset.id); break;
    case 'new-loan': loanForm(t.dataset.id); break;
    case 'edit-loan': loanForm(S.loans[t.dataset.loan].clienteId, t.dataset.loan); break;
    case 'pay': payForm({loanId:t.dataset.loan || undefined}); break;
    case 'filter': UI.f = t.dataset.f; schedule(); break;
    case 'hist-client': UI.hq = cname(t.dataset.id); location.hash = '#historial'; break;
    case 'go-mora': UI.f = 'mora'; UI.q = ''; location.hash = '#clientes'; break;
    case 'more-pays': UI.payLimit += 60; schedule(); break;
    case 'add-note': {
      const ta = $('#newnote'); const txt = ta.value.trim(); if (!txt){ toast('Escriba la nota primero.', true); return; }
      if (await put('notes', nextId('notes'), {clienteId:String(t.dataset.id), fecha:iso(T), texto:txt, creado:new Date().toISOString()})){ toast('Nota guardada'); }
      break; }
    case 'del-note': confirmSheet('Eliminar nota', 'Se eliminará esta nota. No se puede deshacer.', 'Eliminar', async () => { if (await remove('notes', t.dataset.id)){ closeSheet(); toast('Nota eliminada'); } }); break;
    case 'del-pay': { const p = S.payments[t.dataset.id]; if (!p) break;
      const l = S.loans[String(p.loanId)] || {};
      confirmSheet('Eliminar pago', `Se eliminará el pago de <b>${money(p.monto, l.moneda)}</b> del ${fISO(p.fecha)} (${esc(cname(l.clienteId))}). El saldo del préstamo volverá a subir.`, 'Eliminar pago', async () => { if (await remove('payments', t.dataset.id)){ closeSheet(); toast('Pago eliminado'); } }); break; }
    case 'del-loan': { const id = t.dataset.loan; const n = D.loans[id].c.pays.length;
      confirmSheet('Eliminar préstamo', `Se eliminará el préstamo ${esc(id)} y sus ${n} pagos registrados. No se puede deshacer.`, 'Eliminar préstamo', async () => {
        for (const p of D.loans[id].c.pays) await remove('payments', p.id);
        if (await remove('loans', id)){ closeSheet(); toast('Préstamo eliminado'); } }); break; }
    case 'del-client': { const id = t.dataset.id;
      const lids = (D.byClient[String(id)] || []);
      const nPays = lids.reduce((a, l) => a + D.loans[l].c.pays.length, 0);
      const nNotes = Object.values(S.notes).filter(n => String(n.clienteId) === String(id)).length;
      const act = lids.filter(l => D.loans[l].c.estado === 'Activo');
      const deuda = ['Bs', '$us'].map(cur => [cur, act.filter(l => D.loans[l].L.moneda === cur).reduce((a, l) => a + (D.loans[l].c.saldo || 0), 0)]).filter(x => x[1] > 0).map(x => money(x[1], x[0])).join(' y ');
      const detalle = lids.length || nNotes ? `Se eliminará también: <b>${lids.length}</b> ${lids.length === 1 ? 'préstamo' : 'préstamos'}, <b>${nPays}</b> ${nPays === 1 ? 'pago' : 'pagos'} y <b>${nNotes}</b> ${nNotes === 1 ? 'nota' : 'notas'}.` : 'No tiene préstamos, pagos ni notas.';
      const aviso = act.length ? `<div class="warnbox">Este cliente tiene ${act.length} ${act.length === 1 ? 'préstamo activo' : 'préstamos activos'} con saldo pendiente de ${deuda}.</div>` : '';
      confirmSheet('Eliminar cliente', `¿Seguro que quiere eliminar a <b>${esc(cname(id))}</b>?<br>${detalle}${aviso}<br>Esta acción no se puede deshacer.`, 'Sí, eliminar cliente', async () => {
        for (const l of lids){ for (const p of D.loans[l].c.pays) await remove('payments', p.id); await remove('loans', l); }
        for (const [nid, n] of Object.entries(S.notes)) if (String(n.clienteId) === String(id)) await remove('notes', nid);
        if (await remove('clients', id)){ closeSheet(); location.hash = '#clientes'; toast('Cliente eliminado'); } }); break; }
    case 'export-xlsx': exportXlsx(); break;
    case 'export-json': exportJson(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'search'){ UI.q = t.value; const l = $('#clist'); if (l) l.innerHTML = clientList(); return; }
  if (t.dataset && t.dataset.act === 'hsearch'){ UI.hq = t.value; const v = $('#view'); const pos = t.selectionStart; v.innerHTML = vHistorial(); const n = $('.search', v); if (n){ n.focus(); n.setSelectionRange(pos, pos); } return; }
  const form = t.closest && t.closest('form[data-form]'); if (!form) return;
  if (form.dataset.form === 'loan'){
    if (t.name === 'primerVenc') form.dataset.touched = '1';
    if ((t.name === 'fecha' || t.name === 'frecuencia') && !form.dataset.touched) form.primerVenc.value = firstDueFrom(form.fecha.value, form.frecuencia.value);
    updateLoanPreview(form);
  }
  if (form.dataset.form === 'pay'){
    if (t.name === 'monto') form.dataset.autoamt = '';
    if (t.name === 'loan' || t.name === 'concepto') form.dataset.autoamt = '1';
    refreshPay(form);
  }
});
document.addEventListener('change', e => {
  const t = e.target; const form = t.closest && t.closest('form[data-form]'); if (!form) return;
  if (form.dataset.form === 'loan'){ if ((t.name === 'fecha' || t.name === 'frecuencia') && !form.dataset.touched) form.primerVenc.value = firstDueFrom(form.fecha.value, form.frecuencia.value); updateLoanPreview(form); }
  if (form.dataset.form === 'pay' && (t.name === 'loan' || t.name === 'concepto')){ form.dataset.autoamt = '1'; refreshPay(form); }
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form; const btn = form.querySelector('button:not([type=button])');
  const lock = v => { if (btn) btn.disabled = v; };
  if (kind === 'client'){
    const f = new FormData(form); const nombre = String(f.get('nombre') || '').trim().replace(/\s+/g, ' ');
    const id = form.dataset.id;
    if (!nombre) return;
    /* duplicate check relaxed */
    const old = id ? S.clients[id] : {};
    lock(true);
    const nid = id || nextId('clients');
    const ok = await put('clients', nid, Object.assign({}, old, {nombre, telefono:String(f.get('telefono') || '').trim(), direccion:String(f.get('direccion') || '').trim(), calificacion:String(f.get('calificacion') || ''), notasExcel:old.notasExcel || []}));
    lock(false);
    if (ok){ closeSheet(); toast(id ? 'Cliente actualizado' : 'Cliente agregado'); if (!id) location.hash = '#cliente-' + nid; }
  }
  if (kind === 'loan'){
    const L = readLoan(form), id = form.dataset.id, cid = form.dataset.cid;
    if (!(L.monto > 0)){ toast('Escriba el monto prestado.', true); return; }
    if (!id && (L.tasa == null || !L.cuotas || !L.primerVenc)){ toast('Complete interés, cuotas y primer vencimiento.', true); return; }
    const old = id ? S.loans[id] : {};
    if (L.pagadoAntes === undefined) L.pagadoAntes = old.pagadoAntes || 0;
    lock(true);
    const nid = id || nextId('loans');
    const ok = await put('loans', nid, Object.assign({}, old, L, {clienteId:String(cid)}));
    lock(false);
    if (ok){ closeSheet(); toast(id ? 'Préstamo actualizado' : 'Préstamo agregado'); }
  }
  if (kind === 'pay'){
    const lid = form.loan.value, m = num(form.monto.value);
    if (!lid || !(m > 0)){ toast('Escriba un monto mayor a 0.', true); return; }

    const ok = await put('payments', nextId('payments'), {loanId:String(lid), fecha:form.fecha.value, monto:r2(m), concepto:form.concepto.value, creado:new Date().toISOString()});
    lock(false);
    if (ok){ closeSheet(); toast('Pago guardado'); }
  }
  if (kind === 'cfg'){
    const n = Math.round(num(form.dias.value)); if (!(n >= 0)){ toast('Escriba un número de días.', true); return; }
    try { await db.doc('config/ajustes').set({moraLeve:n}); toast('Ajuste guardado'); } catch (err){ toast('No se pudo guardar.', true); }
  }
});

const LocalDB = (() => {
  const KEY = 'misPrestamos.datos.v1';
  let store = {}; const subs = [];
  const clone = o => JSON.parse(JSON.stringify(o));
  const colOf = p => p.split('/').slice(0, -1).join('/');
  function fromBackup(b){
    const st = {};
    ['clients', 'loans', 'payments', 'notes'].forEach(c => Object.entries(b[c] || {}).forEach(([id, d]) => { st[c + '/' + id] = clone(d); }));
    const items = Array.isArray(b.archive) ? b.archive : ((b.archive && b.archive.items) || []);
    st['archive/all'] = {items:clone(items)};
    if (b.cfg && Object.keys(b.cfg).length) st['config/ajustes'] = clone(b.cfg);
    return st;
  }
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { throw new Error('No se pudo guardar en este navegador (almacenamiento lleno o bloqueado).'); } }
  function load(){
    let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw){ try { store = JSON.parse(raw); return; } catch (e) {} }
    store = fromBackup(SEED); try { persist(); } catch (e) {}
  }
  const snapDoc = path => { const d = store[path]; return {id:path.split('/').pop(), exists:d !== undefined, data:() => d === undefined ? undefined : clone(d)}; };
  const snapCol = col => { const docs = Object.keys(store).filter(p => colOf(p) === col).map(snapDoc); return {docs, size:docs.length, empty:!docs.length}; };
  const notify = path => subs.forEach(s => { if (s.type === 'doc' && s.path === path) s.fn(snapDoc(path)); if (s.type === 'col' && s.path === colOf(path)) s.fn(snapCol(s.path)); });
  const notifyAll = () => subs.forEach(s => s.fn(s.type === 'doc' ? snapDoc(s.path) : snapCol(s.path)));
  const docRef = path => ({
    id:path.split('/').pop(), path,
    get: async () => snapDoc(path),
    set: async data => { const prev = store[path]; store[path] = clone(data); try { persist(); } catch (e) { if (prev === undefined) delete store[path]; else store[path] = prev; throw e; } setTimeout(() => notify(path), 0); },
    delete: async () => { const prev = store[path]; delete store[path]; try { persist(); } catch (e) { store[path] = prev; throw e; } setTimeout(() => notify(path), 0); },
    onSnapshot: fn => { const s = {type:'doc', path, fn}; subs.push(s); setTimeout(() => fn(snapDoc(path)), 0); return () => {}; }
  });
  const colRef = col => ({ path:col, doc:id => docRef(col + '/' + id), onSnapshot: fn => { const s = {type:'col', path:col, fn}; subs.push(s); setTimeout(() => fn(snapCol(col)), 0); return () => {}; } });

})();
